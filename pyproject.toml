[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-mtec-http"
version = "1.2.8"
description = "M-TEC Heat Pump Integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13.2"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.13.5",
]

[project.optional-dependencies]
lint = [
    "ruff==0.16.9",
    "mypy==2.3.1",
]
dev = [
    "homeassistant-mtec-http[lint]",
    "pytest==9.0.3",
    "pytest-aiohttp==1.1.1",
    "pytest-cov==7.1.0",
    "pytest-homeassistant-custom-component==0.13.356",
    "homeassistant==2026.8.2",
    "aiohttp==3.14.3",
    # The maintained fork retains the aioresponses import used by the tests.
    "aioresponses-ng==0.8.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["custom_components/mtec"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
